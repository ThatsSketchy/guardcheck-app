<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GuardCheck App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; color: #fff; display: flex; align-items: center; justify-content: center; }
        .container { max-width: 720px; width: 90%; padding: 60px 40px; background: rgba(255,255,255,0.05); border-radius: 20px; backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        h1 { font-size: 36px; font-weight: 700; margin-bottom: 16px; background: linear-gradient(90deg, #e94560, #0f3460); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        p { font-size: 18px; color: rgba(255,255,255,0.8); line-height: 1.6; margin-bottom: 32px; }
        .button { display: inline-block; padding: 16px 40px; background: linear-gradient(90deg, #e94560, #ff6b6b); color: #fff; text-decoration: none; border-radius: 50px; font-weight: 600; font-size: 16px; transition: all 0.3s ease; box-shadow: 0 4px 16px rgba(233,69,96,0.4); }
        .button:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(233,69,96,0.5); }
        .status { display: flex; align-items: center; gap: 10px; margin-top: 24px; }
        .status-dot { width: 12px; height: 12px; background: #00ff88; border-radius: 50%; box-shadow: 0 0 10px #00ff88; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>GuardCheck App</h1>
        <p>Safety monitoring for your team</p>
        <a href="#" class="button">Get Started</a>
        <div class="status"><div class="status-dot"></div><span>System Online</span></div>
    </div>
</body>
</html>
