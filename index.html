<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuardCheck — Security & Investigative Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0d12;
            --text-primary: #e8eaed;
            --accent: #0ea5e9;
            --accent-glow: rgba(14, 165, 233, 0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #0f1115 0%, #14181d 100%);
            color: var(--text-primary);
            min-height: 100vh;
        }
        .container { max-width: 980px; margin: 0 auto; padding: 28px 20px; }
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 0;
            margin-bottom: 24px;
        }
        .brand { font-size: 20px; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
        .brand span { color: var(--accent); }
        nav {
            display: flex; gap: 8px;
        }
        .nav-btn {
            padding: 8px 14px;
            background: rgba(20, 24, 30, 0.5);
            border: 1px solid rgba(14,165,233,0.2);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .nav-btn:hover { background: rgba(14,165,233,0.15); color: #fff; }
        .nav-btn.active { background: var(--accent); border-color: var(--accent);
            box-shadow: 0 4px 16px var(--accent-glow); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="brand">Guard<span>Check</span></div>
            <nav>
                <button class="nav-btn active">Overview</button>
                <button class="nav-btn">Statistics</button>
                <button class="nav-btn">About</button>
            </nav>
        </header>
    </div>
</body>
</html>
